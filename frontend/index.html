<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="MediQueue - Sistem Antrian Klinik Pintar" />
    <title>MediQueue - Sistem Antrian Klinik</title>
    <!-- Font infrastructure: preconnect to CDN origins for faster DNS + TLS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!--
      Preload critical fonts — Req 11.4
      Plus Jakarta Sans Regular (400): primary body font — loaded first to avoid FOUT on body text
      Space Grotesk Bold (700): display font used for hero headlines
      Both use type="font/woff2" and crossorigin (required for CORS font requests)
    -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/plusjakartasans/v8/LDIoaomQNQcsA88c7O9yZ4KMCoOg4IA6-91aHEjcWuA_KU7NSg.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    >
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/spacegrotesk/v16/V8mQoQDjQSkFtoMM3T6r8E7mF71Q-gozuPTPgb0.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    >

    <!--
      Google Fonts stylesheet — loads all three font families with all required weights.
      display=swap is set at the URL level as a fallback; @font-face in fonts.css
      also declares font-display: swap for each weight individually (Req 11.1).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
